<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Animation</title>
  <style>
  canvas {
    display: block;
    margin: 20px auto;
    border: 2px solid #000;
  }
    
  </style>
</head>
<body>
  <canvas id="artCanvas" width="600" height="400"></canvas>
  <script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');

    let angle = 0;
    let rectX = 50;
    let rectDirection = 1;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
    
      ctx.fillstyle = 'rgba(100, 150, 255, 0.5)';
      ctx.strokeStyle = '#000';

      const rectY = 175;
      ctx.fillRect(rectX, rectY, 100, 50);
      ctx.strokeRect(rectX, rectY, 100, 50);
      
      rectX += rectDirection * 2;
      if (rectX + 100 > canvas.width || rectX < 0) rectDirection *= -1;

      ctx.beginPath();
      ctx.moveTo(50, 200);
      ctx.lineTo(550, 200);
      ctx.stroke();

      const circleCenterX = canvas.width / 2;
      const circleCenterY = canvas.height / 2;
      const circleRadius = 50;

      ctx.beginPath();
      ctx.arc(circleCenterX, circleCenterY, circleRadius, 0, Math.PI * 2);
      ctx.stroke();

      
      ctx.save();
      ctx.translate(circleCenterX, circleCenterY); 
      ctx.rotate((angle * Math.PI) / 180); 
      ctx.fillStyle = 'rgba(255, 100, 100, 0.5)';
      const squareSize = 30; 
      ctx.fillRect(-squareSize / 2, -squareSize / 2, squareSize, squareSize);
      ctx.restore();

      angle += 2;

      ctx.restore();

      requestAnimationFrame(draw);
    }

    draw();



    
  </script>
</body>
</html>
